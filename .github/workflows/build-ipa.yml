name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 16 并安装 xcbeautify
        run: |
          # 选用最新的 Xcode 16.x
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          
          # 安装或确保有 xcbeautify（用于过滤海量编译日志）
          brew install xcbeautify 2>/dev/null || true

      - name: 下载内置依赖库
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 编译并生成 IPA
        run: |
          set -o pipefail
          
          # 获取真实 Scheme
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} flag' | sed -e 's/^[ \t]*//' | grep -i 'Code' | head -n 1)
          echo ">>> 正在使用 Scheme: [$SCHEME] 编译..."

          # 执行 Archive 构建（通过 xcbeautify 过滤垃圾日志，防止被截断）
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Code.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            2>&1 | tee raw_build.log | xcbeautify || {
              echo "==================== 构建失败！提取核心错误日志 ===================="
              grep -E "(error:|\/\* com.apple.actool.errors \*\/)" -A 10 raw_build.log || tail -n 50 raw_build.log
              echo "================================================================="
              exit 1
            }

          # 提取 App 并打包为 IPA
          mkdir -p Payload
          cp -r build/Code.xcarchive/Products/Applications/*.app Payload/
          zip -r -q CodeApp.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 制品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-IPA
          path: CodeApp.ipa
          retention-days: 7

      - name: 上传完整错误日志 (若失败自动保留)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Build-Log
          path: raw_build.log
          retention-days: 3
