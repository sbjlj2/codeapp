name: Build IPA

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  build:
    runs-on: macos-14 # 使用 GitHub 托管的 macOS 环境

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme CodeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/CodeApp.app Payload/
          zip -r -q CodeApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
