name: Build CodeApp IPA

on:
  workflow_dispatch: # 支持手动一键运行

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90 # 预防超时中断

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 下载内置环境依赖 (Python/Node/PHP等)
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 打印工程 Schemes 列表 (供排查核对)
        run: xcodebuild -list -project Code.xcodeproj

      - name: 编译并归档工程 (Archive)
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Code.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包生成未签名 IPA
        run: |
          mkdir -p Payload
          # 将编译生成的 .app 移动到 Payload 目录
          cp -r build/Code.xcarchive/Products/Applications/*.app Payload/
          # 压缩打包为 IPA
          zip -r -q CodeApp.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 为制品 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-IPA
          path: CodeApp.ipa
          retention-days: 7
