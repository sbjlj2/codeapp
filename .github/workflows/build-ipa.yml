name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 切换为最新版 Xcode
        run: |
          echo "=== 当前 Runner 上安装的所有 Xcode 版本 ==="
          ls -d /Applications/Xcode* || true
          
          # 优先使用 Xcode 16，若不存在则使用系统中最新默认版本
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            echo "使用系统默认最高版本 Xcode"
          fi
          xcodebuild -version

      - name: 下载内置依赖库
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 编译并生成 IPA
        run: |
          # 查找包含 Code 的 Scheme
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} flag' | sed -e 's/^[ \t]*//' | grep -i 'Code' | head -n 1)
          echo ">>> 正在使用 Scheme: [$SCHEME] 进行构建..."

          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Code.xcarchive \
            -resultBundlePath build/ResultBundle.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_OPTIMIZATION=time || {
              echo "!!! 编译失败，正在提取详细错误日志 !!!"
              xcrun xcresulttool get --path build/ResultBundle.xcresult --format json 2>/dev/null || true
              exit 1
            }

          # 提取 App 并打包为 IPA
          mkdir -p Payload
          cp -r build/Code.xcarchive/Products/Applications/*.app Payload/
          zip -r -q CodeApp.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 制品
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-IPA
          path: CodeApp.ipa
          retention-days: 7
