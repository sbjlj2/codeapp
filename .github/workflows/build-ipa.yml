name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 下载内置依赖库
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 检查工程配置并编译打包
        run: |
          echo "=== 查看工程中的 Targets 和 Schemes ==="
          xcodebuild -list -project Code.xcodeproj

          # 查找包含 Code 的 Scheme（优先匹配 "Code App"）
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} flag' | sed -e 's/^[ \t]*//' | grep -i 'Code' | head -n 1)

          if [ -n "$SCHEME" ]; then
            echo ">>> 检测到有效 Scheme: [$SCHEME]，执行 Archive..."
            xcodebuild archive \
              -project Code.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Code.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            mkdir -p Payload
            cp -r build/Code.xcarchive/Products/Applications/*.app Payload/
          else
            echo ">>> 未检测到共享 Scheme，直接通过 Target 编译..."
            # 获取主 Target 名称
            TARGET=$(xcodebuild -list -project Code.xcodeproj | awk '/Targets:/{flag=1; next} /Build Configurations:/{flag=0} flag' | sed -e 's/^[ \t]*//' | grep -E '^Code( App)?$' | head -n 1)
            echo ">>> 正在编译 Target: [$TARGET]..."
            
            xcodebuild build \
              -project Code.xcodeproj \
              -target "$TARGET" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            mkdir -p Payload
            cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          fi

          # 打包成 IPA
          zip -r -q CodeApp.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 制品
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-IPA
          path: CodeApp.ipa
          retention-days: 7
